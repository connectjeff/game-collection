[project]
name = "game-collection"
version = "0.1.0"
description = "Photo-assisted physical video game collection inventory pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
image = ["opencv-python>=4.8", "pillow>=10"]

[project.scripts]
game-collection = "game_collection.cli:main"

[tool.setuptools.packages.find]
include = ["game_collection*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
