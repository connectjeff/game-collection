[project]
name = "game-collection"
version = "0.1.0"
description = "Mobile web app for barcode-based physical video game collection inventory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.8",
]

[project.scripts]
game-collection = "game_collection.cli:main"

[tool.setuptools.packages.find]
include = ["game_collection*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
